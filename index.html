<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semana ZEISS 2026 — encerrada</title>
<meta name="description" content="A Semana ZEISS 2026 foi encerrada.">
<meta property="og:title" content="Semana ZEISS 2026 encerrada">
<meta property="og:description" content="A Semana ZEISS 2026 foi encerrada.">
<meta property="og:image" content="https://semanazeissrio.com.br/assets/foto-zeiss.webp">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" as="image" href="/assets/foto-zeiss.webp">
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/archivo-latin.woff2" crossorigin>
<script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "98ebdb1d451549c5970b1c91e564b337"}'></script>
<style>
  @font-face{
    font-family:"Archivo";
    src:url("/assets/fonts/archivo-latin.woff2") format("woff2");
    font-weight:100 900;font-style:normal;font-display:swap;
  }
  :root{
    /* azul da campanha ZEISS, amostrado do banner oficial deles */
    --zeiss:#0F2DB3;
    --branco:#FFFFFF;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden}
  body{background:var(--zeiss);color:var(--branco);
       font-family:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
       -webkit-font-smoothing:antialiased}

  /* dois blocos SOLIDOS, corte reto. nenhum degrade em lugar nenhum */
  .hero{height:100svh;width:100%;display:grid;grid-template-columns:1fr 1fr;overflow:hidden}

  .painel{background:var(--zeiss);display:flex;flex-direction:column;
          justify-content:center;position:relative;
          padding:clamp(28px,4.6vw,80px)}

  .logo{height:clamp(38px,4.4vw,64px);width:auto;display:block;
        position:absolute;top:clamp(28px,4.6vw,80px);left:clamp(28px,4.6vw,80px)}

  /* os colchetes de enquadramento sao a assinatura grafica da ZEISS */
  .marco{position:relative;align-self:start;
         padding:clamp(22px,3vw,48px) clamp(20px,2.6vw,44px)}
  .marco::before,.marco::after{content:"";position:absolute;
    width:clamp(26px,3.4vw,58px);height:clamp(26px,3.4vw,58px);
    border:2px solid var(--branco)}
  .marco::before{top:0;left:0;border-right:0;border-bottom:0}
  .marco::after{bottom:0;right:0;border-left:0;border-top:0}

  .titulo{margin:0;font-weight:800;text-transform:uppercase;
          letter-spacing:-.03em;line-height:.86;
          font-size:clamp(2rem,4.6vw,4.4rem);color:var(--branco)}
  .titulo span{display:block}

  .foto{position:relative;overflow:hidden;background:var(--zeiss)}
  .foto img{width:100%;height:100%;object-fit:cover;object-position:60% center;display:block}

  @media (max-height:620px){
    .logo{height:34px}
    .titulo{font-size:clamp(1.7rem,3.6vw,2.6rem)}
    .marco{padding:18px 16px}
  }

  @media (max-width:860px){
    .hero{grid-template-columns:1fr;grid-template-rows:44svh 56svh}
    .foto{order:1}
    .foto img{object-position:58% center}
    .painel{order:2;justify-content:center;padding:clamp(26px,7vw,44px)}
    .logo{position:static;align-self:flex-start;   /* sem isso o flex estica a marca */
           height:clamp(32px,8vw,44px);margin-bottom:clamp(18px,4vw,28px)}
    .marco{align-self:start}
    .titulo{font-size:clamp(1.9rem,8.2vw,3rem)}
  }
</style>
</head>
<body>

<main class="hero">

  <section class="painel">
    <img class="logo" src="/assets/zeiss-logo-branca.png" alt="ZEISS" width="640" height="640">
    <div class="marco">
      <h1 class="titulo">
        <span>Semana ZEISS</span>
        <span>2026</span>
        <span>encerrada</span>
      </h1>
    </div>
  </section>

  <section class="foto">
    <img src="/assets/foto-zeiss.webp" alt="" width="1700" height="1760" fetchpriority="high">
  </section>

</main>

</body>
</html>
