  @font-face{

  :root{
    --zeiss:#0F2DB3;        /* azul da campanha, do site oficial */
    --branco:#FFFFFF;
    --fita:clamp(46px,5.4svh,64px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden}
  body{background:var(--zeiss);color:var(--branco);
       font-family:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
       -webkit-font-smoothing:antialiased}

  /* arquitetura do hero da Kawasaki: foto absoluta cobrindo tudo, corpo
     absoluto por cima, fita ancorada na base. Uma tela, sem rolagem. */
  .hero{position:relative;height:100svh;width:100%;overflow:hidden}

  .hero__foto{position:absolute;inset:0;width:100%;height:100%;z-index:0}
  .hero__foto img{position:absolute;inset:0;width:100%;height:100%;
                  object-fit:cover;object-position:left center}

  .hero__corpo{position:absolute;inset:0;z-index:1;
               display:flex;flex-direction:column;justify-content:center;
               padding:0 clamp(28px,5vw,92px) var(--fita);
               max-width:min(58vw,860px)}

  .logo{position:absolute;z-index:2;height:clamp(34px,3.8vw,54px);width:auto;
        top:clamp(26px,4vw,62px);left:clamp(28px,5vw,92px)}

  /* colchetes de enquadramento: assinatura gráfica da ZEISS */
  .marco{position:relative;align-self:flex-start;
         padding:clamp(22px,3vw,48px) clamp(20px,2.6vw,44px)}
  .marco::before,.marco::after{content:"";position:absolute;
    width:clamp(26px,3.4vw,58px);height:clamp(26px,3.4vw,58px);
    border:2px solid var(--branco)}
  .marco::before{top:0;left:0;border-right:0;border-bottom:0}
  .marco::after{bottom:0;right:0;border-left:0;border-top:0}

  .titulo{margin:0;font-weight:800;text-transform:uppercase;
          letter-spacing:-.03em;line-height:.86;
          font-size:clamp(2.1rem,5.2vw,5rem)}
  .titulo span{display:block}

  /* a tarja: diz o que aconteceu, ancorada na base como a fita da Kawasaki */
  .fita{position:absolute;left:0;right:0;bottom:0;z-index:2;
        height:var(--fita);background:var(--branco);color:var(--zeiss);
        display:flex;align-items:center;justify-content:center;
        font-weight:700;text-transform:uppercase;
        letter-spacing:.22em;font-size:clamp(.66rem,1.05vw,.86rem);
        padding:0 clamp(20px,4vw,40px);text-align:center}

  @media (max-height:620px){
    .logo{height:30px}
    .titulo{font-size:clamp(1.8rem,4.2vw,2.8rem)}
    .marco{padding:16px 14px}
  }

  @media (max-width:860px){
    .hero__foto img{object-position:center top}
    .hero__corpo{justify-content:flex-start;max-width:100%;
                 padding:clamp(96px,22vw,150px) clamp(24px,6vw,34px) 0}
    .logo{top:clamp(24px,6vw,34px);left:clamp(24px,6vw,34px);height:clamp(32px,8vw,42px)}
    .titulo{font-size:clamp(2rem,9vw,3.1rem)}
  }
