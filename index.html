<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semana ZEISS 2026 — encerrada</title>
<meta name="description" content="A Semana ZEISS 2026 está encerrada até segunda ordem.">
<meta property="og:title" content="Semana ZEISS 2026 — encerrada">
<meta property="og:description" content="Acabou. Até segunda ordem.">
<meta property="og:image" content="https://semanazeissrio.com.br/assets/hero-zeiss.webp">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" as="image" href="/assets/hero-zeiss.webp">
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/archivo-latin.woff2" crossorigin>
<script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "98ebdb1d451549c5970b1c91e564b337"}'></script>
<style>
  @font-face{
    font-family:"Archivo";
    src:url("/assets/fonts/archivo-latin.woff2") format("woff2");
    font-weight:100 900;font-style:normal;font-display:swap;
  }
  :root{--azul:#164191;--claro:#a8c8f0}
  *{box-sizing:border-box}

  /* uma tela, sempre. nada de barra de rolagem */
  html,body{margin:0;padding:0;height:100%;overflow:hidden}
  body{background:var(--azul);color:#fff;
       font-family:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
       -webkit-font-smoothing:antialiased}

  .hero{position:relative;height:100svh;width:100%;overflow:hidden;
        display:flex;align-items:center}

  /* a foto E o fundo. sem veu, sem sombra, sem gradiente por cima:
     o azul da esquerda ja vem da propria imagem */
  .bg{position:absolute;inset:0;width:100%;height:100%;
      object-fit:cover;object-position:right bottom;z-index:0}

  .texto{position:relative;z-index:1;
         padding-left:clamp(28px,5vw,86px);padding-right:clamp(24px,3vw,48px);
         max-width:min(54vw,720px)}

  .logo{height:clamp(28px,3.4vw,46px);width:auto;display:block;
        margin-bottom:clamp(20px,3.4vw,40px)}

  .titulo{margin:0;font-weight:800;text-transform:uppercase;
          letter-spacing:-.025em;line-height:.9;
          font-size:clamp(2.2rem,5.4vw,4.9rem)}
  .titulo span{display:block}
  .titulo .encerrada{color:var(--claro);margin-top:.06em}

  .linha{border:0;width:clamp(48px,6vw,104px);height:3px;background:var(--claro);
         margin:clamp(20px,2.8vw,36px) 0 clamp(14px,2vw,24px)}

  .obrigado{margin:0;max-width:28ch;
            font-size:clamp(.95rem,1.4vw,1.25rem);line-height:1.5;
            color:rgba(255,255,255,.92)}

  /* telas baixas: encolhe em vez de criar rolagem */
  @media (max-height:640px){
    .logo{height:26px;margin-bottom:14px}
    .titulo{font-size:clamp(1.9rem,4.4vw,3rem)}
    .linha{margin:16px 0 12px}
    .obrigado{font-size:.95rem}
  }

  @media (max-width:820px){
    .hero{align-items:flex-end}
    .bg{object-position:74% bottom}
    .texto{max-width:100%;padding:0 clamp(26px,7vw,38px) clamp(34px,8vw,52px);
           /* so no mobile o texto fica sobre a foto, entao precisa de base */
           background:linear-gradient(to top, rgba(13,38,88,.96) 42%, rgba(15,44,101,.72) 68%, rgba(22,65,145,0) 100%);
           padding-top:clamp(60px,16vw,110px);width:100%}
    .titulo{font-size:clamp(2rem,9vw,3.2rem)}
    .obrigado{max-width:26ch}
  }
</style>
</head>
<body>

<main class="hero">
  <img class="bg" src="/assets/hero-zeiss.webp" alt="" width="2400" height="1200" fetchpriority="high">

  <div class="texto">
    <img class="logo" src="/assets/zeiss-logo-branca.png" alt="ZEISS" width="640" height="640">

    <h1 class="titulo">
      <span>Semana</span>
      <span>ZEISS 2026</span>
      <span class="encerrada">Encerrada</span>
    </h1>

    <hr class="linha">

    <p class="obrigado">Acabou. Até segunda ordem.</p>
  </div>
</main>

</body>
</html>
