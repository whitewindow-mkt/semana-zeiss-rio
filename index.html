<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semana ZEISS 2026 — encerrada</title>
<meta name="description" content="A Semana ZEISS 2026 foi encerrada. Obrigado a todos que participaram.">
<meta name="robots" content="noindex">
<meta property="og:title" content="Semana ZEISS 2026 — encerrada">
<meta property="og:description" content="Obrigado a todos que participaram. Até a próxima edição.">
<meta property="og:image" content="https://semanazeissrio.com.br/assets/hero-zeiss.webp">
<link rel="preload" as="image" href="/assets/hero-zeiss.webp">
<script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "98ebdb1d451549c5970b1c91e564b337"}'></script>
<style>
  :root{--azul:#164191;--claro:#a8c8f0}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{background:var(--azul);color:#fff;
       font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}

  .hero{position:relative;min-height:100svh;display:flex;align-items:center;overflow:hidden}

  /* a foto E o fundo: cobre a tela inteira, ancorada na direita pra mulher
     nunca ficar no centro e o lado esquerdo sobrar pro texto */
  .bg{position:absolute;inset:0;width:100%;height:100%;
      object-fit:cover;object-position:right bottom;z-index:0}

  /* reforco de contraste so na faixa do texto; morre antes da mulher */
  .veu{position:absolute;inset:0;z-index:1;
       background:linear-gradient(95deg, rgba(9,28,68,.72) 0%, rgba(12,36,84,.45) 30%, rgba(22,65,145,0) 58%)}

  .texto{position:relative;z-index:2;padding:clamp(32px,6vw,88px);max-width:min(56vw,760px)}

  .logo{height:clamp(34px,4vw,54px);width:auto;display:block;
        margin-bottom:clamp(28px,4.5vw,52px)}

  .titulo{margin:0;font-weight:800;text-transform:uppercase;
          letter-spacing:-.02em;line-height:.92;
          font-size:clamp(2.4rem,6vw,5.4rem);
          text-shadow:0 2px 24px rgba(6,20,50,.35)}
  .titulo span{display:block}
  .titulo .encerrada{color:var(--claro);margin-top:.08em}

  .linha{border:0;width:clamp(56px,7vw,120px);height:3px;background:var(--claro);
         margin:clamp(26px,3.4vw,44px) 0 clamp(18px,2.4vw,28px)}

  .obrigado{margin:0;max-width:30ch;font-size:clamp(1rem,1.5vw,1.32rem);
            line-height:1.55;color:rgba(255,255,255,.92)}

  .rodape{margin-top:clamp(28px,4.5vw,56px);font-size:clamp(.72rem,1vw,.85rem);
          letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.55)}

  @media (max-width:820px){
    .hero{align-items:flex-end}
    .bg{object-position:72% bottom}
    .veu{background:linear-gradient(to top, rgba(9,28,68,.94) 30%, rgba(12,36,84,.6) 55%, rgba(22,65,145,0) 88%)}
    .texto{max-width:100%;padding:clamp(28px,7vw,40px);padding-bottom:clamp(36px,9vw,56px)}
    .titulo{font-size:clamp(2.2rem,9.5vw,3.4rem)}
    .obrigado{max-width:26ch}
  }
</style>
</head>
<body>

<main class="hero">
  <img class="bg" src="/assets/hero-zeiss.webp" alt="" width="1900" height="1200" fetchpriority="high">
  <div class="veu"></div>

  <div class="texto">
    <img class="logo" src="/assets/zeiss-logo-branca.png" alt="ZEISS" width="640" height="640">

    <h1 class="titulo">
      <span>Semana</span>
      <span>ZEISS 2026</span>
      <span class="encerrada">Encerrada</span>
    </h1>

    <hr class="linha">

    <p class="obrigado">
      Obrigado a todos que participaram.<br>
      Até a próxima edição.
    </p>

    <p class="rodape">Rio de Janeiro</p>
  </div>
</main>

</body>
</html>
